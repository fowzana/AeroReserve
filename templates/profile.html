<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | AeroReserve</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: linear-gradient(135deg, #eef5ff, #f8fbff);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .profile-container {
            max-width: 850px;
            margin: 70px auto;
        }

        .profile-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 70, 150, 0.15);
        }

        .profile-header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: white;
            text-align: center;
            padding: 45px 20px 55px;
        }

        .profile-icon {
            width: 110px;
            height: 110px;
            background: white;
            color: #0d6efd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 65px;
            box-shadow: 0 8px 20px rgba(0,0,0,.2);
        }

        .profile-header h2 {
            margin-top: 20px;
            font-weight: bold;
        }

        .profile-header p {
            margin-bottom: 0;
            opacity: .9;
        }

        .profile-body {
            padding: 35px;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            height: 100%;
            transition: .3s;
        }

        .info-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,.08);
        }

        .info-icon {
            font-size: 28px;
            color: #0d6efd;
        }

        .booking-box {
            background: linear-gradient(135deg, #e7f1ff, #f5f9ff);
            border: 1px solid #cfe2ff;
            border-radius: 18px;
            padding: 22px;
            margin-top: 25px;
        }

        .booking-number {
            font-size: 30px;
            font-weight: bold;
            color: #0d6efd;
        }

        .btn {
            border-radius: 10px;
            padding: 11px 22px;
            font-weight: 500;
        }

    </style>
</head>

<body>

<div class="container profile-container">

    <div class="profile-card">

        <!-- Profile Header -->
        <div class="profile-header">

            <div class="profile-icon">
                <i class="bi bi-person-fill"></i>
            </div>

            <h2>{{ request.user.username }}</h2>

            <p>
                <i class="bi bi-envelope-fill"></i>
                {{ request.user.email }}
            </p>

            <small>
                <i class="bi bi-shield-check"></i>
                Registered AeroReserve User
            </small>

        </div>


        <!-- Profile Body -->
        <div class="profile-body">

            <h4 class="fw-bold mb-4">
                <i class="bi bi-person-lines-fill text-primary"></i>
                Account Information
            </h4>


            <div class="row g-4">

                <!-- Username -->
                <div class="col-md-6">

                    <div class="info-box">

                        <i class="bi bi-person-fill info-icon"></i>

                        <p class="text-muted mb-1 mt-2">
                            Username
                        </p>

                        <h5 class="fw-bold">
                            {{ request.user.username }}
                        </h5>

                    </div>

                </div>


                <!-- Email -->
                <div class="col-md-6">

                    <div class="info-box">

                        <i class="bi bi-envelope-fill info-icon"></i>

                        <p class="text-muted mb-1 mt-2">
                            Email Address
                        </p>

                        <h5 class="fw-bold">
                            {{ request.user.email }}
                        </h5>

                    </div>

                </div>

            </div>


            <!-- Booking Information -->
            <div class="booking-box">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <p class="text-muted mb-1">
                            <i class="bi bi-ticket-perforated-fill"></i>
                            Total Bookings
                        </p>

                        <div class="booking-number">
                            {{ total_bookings }}
                        </div>

                    </div>

                    <i class="bi bi-airplane-fill text-primary"
                       style="font-size:45px;"></i>

                </div>

            </div>


            <!-- Buttons -->
            <div class="text-center mt-4">

                <a href="{% url 'my_bookings' %}"
                   class="btn btn-primary me-2">

                    <i class="bi bi-ticket-detailed-fill"></i>
                    My Bookings

                </a>


                <a href="{% url 'home' %}"
                   class="btn btn-outline-secondary">

                    <i class="bi bi-house-fill"></i>
                    Home

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
