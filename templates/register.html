<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AeroReserve</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            font-family: Arial, sans-serif;
            background-image:
            linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
            url("images/loginbackimg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        .glass-card{

    width:430px;

    background:rgba(255,255,255,0.35);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.4);

    border-radius:25px;

    padding:40px;

    box-shadow:0 15px 40px rgba(0,0,0,0.35);

}



        .form-control{
            border-radius:10px;
            padding:10px;
        }

        .btn-primary{
            border-radius:30px;
            padding:10px;
        }

    </style>

</head>

<body>

<div class="container my-4">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-lg-5 col-md-6">

            <div class="card glass-card shadow-lg border-0 p-4">

                <div class="text-center mb-4">

                    <h3 class="text-primary fw-bold">
                        ✈ AeroReserve
                    </h3>

                    <h3 class=" fw-bold mt-3">
                        Create Account
                    </h3>

                    <p style="color:rgb(17, 15, 15);">
                        Register to start booking your flights
                    </p>

                </div>
                {% if messages %}
    {% for message in messages %}
        <div class="alert alert-info">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

               <form method="POST">
                 {% csrf_token %}


                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="username" placeholder="Enter your full name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" name="email" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" placeholder="Enter your phone number">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Create password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" placeholder="Confirm password">
                    </div>

                   <button type="submit" class="btn btn-primary w-100">
    <i class="bi bi-person-plus-fill"></i>
    Register
</button>

                   <p class="text-center mt-3">
    Already have an account?
    <a href="{% url 'login' %}" class="text-decoration-none">
        Login
    </a>
</p>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
